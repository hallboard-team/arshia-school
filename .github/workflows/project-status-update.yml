name: Project Status Sync – Branch-based Automation

on:
  pull_request_review:
    types: [submitted]
    branches:
      - 'release/*'
      - 'main'
  workflow_dispatch:

jobs:
  update_project_status:
    name: Update GitHub Project Status
    runs-on: ubuntu-latest

    permissions:
      issues: write
      pull-requests: read
      contents: read

    steps:
      # --------------------------------------------------------
      # 1️⃣ Checkout repo
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # 2️⃣ Determine status based on PR base branch
      # --------------------------------------------------------
      - name: Determine Target Status
        id: calc_status
        run: |
          echo "🔍 Checking PR base branch: ${{ github.event.pull_request.base.ref }}"
          echo "🔍 Review state: ${{ github.event.review.state }}"

          # Only continue if review is approved
          if [[ "${{ github.event.review.state }}" != "approved" ]]; then
            echo "::notice::Review was not an approval, skipping status update."
            exit 0
          fi

          BASE="${{ github.event.pull_request.base.ref }}"
          TARGET_STATUS=""

          if [[ "$BASE" == release/* ]]; then
            TARGET_STATUS="Review"
          elif [[ "$BASE" == "main" ]]; then
            TARGET_STATUS="Done"
          else
            echo "::notice::Base branch ($BASE) does not trigger a status change."
            exit 0
          fi

          echo "TARGET_STATUS=$TARGET_STATUS" >> $GITHUB_ENV
          echo "✅ Will set status to: $TARGET_STATUS"

      # --------------------------------------------------------
      # 3️⃣ Update project item status
      # --------------------------------------------------------
      - name: Update Project Status
        if: env.TARGET_STATUS != ''
        uses: leonsteinhaeuser/project-beta-automations@v2.1.0
        with:
          gh_token: ${{ secrets.GH_TOKEN }}
          organization: hallboard-team
          project_id: PVT_kwDODTVfn84A-8fi  # 🧠 Replace this with your real Project ID
          status_value: ${{ env.TARGET_STATUS }}

      # --------------------------------------------------------
      # 🔹 Step 3 – Confirmation log (optional)
      # --------------------------------------------------------
      - name: Confirm update
        if: env.TARGET_STATUS != ''
        run: echo "✅ Project status set to $TARGET_STATUS for PR → ${{ github.event.pull_request.html_url }}"
