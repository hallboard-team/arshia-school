<header>
  <nav>
    <app-navbar />
  </nav>
</header>

<form [formGroup]="filterFg" class="form-filters">
  <div class="filter">
    <span class="title">جست و جو</span>
    <span class="filter-by">نام/نام خانوادگی کاربر</span>
    <mat-form-field>
      <input class="input-search" formControlName="searchCtrl" matInput placeholder="نام/نام خانوادگی" type="text">
      <button mat-icon-button matSuffix tabindex="-1" class="search-icon-btn">
        <mat-icon>search</mat-icon>
      </button>
    </mat-form-field>
  </div>

  <div class="age">
    <span>سن کاربر</span>
    <div class="slider">
      <mat-slider discrete max="{{maxAge}}" min="{{minAge}}">
        <input formControlName="minAgeCtrl" matSliderStartThumb>
        <input formControlName="maxAgeCtrl" matSliderEndThumb>
      </mat-slider>
    </div>
  </div>

  <div class="btns">
    <button (click)="updateMemberParams(); getAll();" color="primary" mat-stroked-button>
      جست و جو
    </button>
    <button class="remove-filters" (click)="reset()" mat-stroked-button>
      پاک کردن فیلتر ها
    </button>
  </div>
</form>

<section class="members-container">
  <div class="div-title">
    <span class="title">کاربران</span>
  </div>

  <div class="div-cards-member">
    @if (members && members.length > 0) {
    @for (member of members; track $index) {
    <app-member-card [memberInput]="member"></app-member-card>
    }
    } @else {
    <div class="no-result">
      کاربری با این مشخصات پیدا نشد.
    </div>
    }
  </div>

  @if (pagination && memberParams) {
  <mat-paginator #paginator (page)="handlePageEvent($event)" [length]="pagination.totalItems"
    [pageSize]="memberParams.pageSize" [pageIndex]="memberParams.pageNumber - 1" [pageSizeOptions]="pageSizeOptions"
    [disabled]="false" [showFirstLastButtons]="true" [hidePageSize]="false" aria-label="Select page" class="paginator">
  </mat-paginator>
  }
</section>
