<div class="main" [class.sidebar-collapsed]="sidebarCollapsed" [class.no-sidebar]="accountService.loggedInUserSig() === null">

        <router-outlet />
    </div>

    @if (accountService.loggedInUserSig()) {

        <app-right-sidebar (collapsedChange)="onSidebarState($event)" />
    </div>
    }
</div>
