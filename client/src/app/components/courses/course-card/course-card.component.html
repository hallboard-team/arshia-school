@if (courseIn) {
    @if (loggedInUserSig && loggedInUserSig()?.roles?.includes('manager')) {
    <div class="card-items" [routerLink]="['/dashboard/update-course', courseIn.title]" routerLinkActive
        #rla="routerLinkActive">
        
        <span class="course-title">{{ courseIn.title }}</span>
        
        <span class="text">توضیحات: {{ courseIn.description }}</span>
        
        <span class="text">⏱️ مدت دوره: {{ courseIn.totalMinutes }} دقیقه</span>
        @if (courseIn.isActive) {
        <span class="text-isStarted-true">فعال ✅</span>
        }@else {
        <span class="text-isStarted-false">غیرفعال ❌</span>
        }
    
        <button class="btn-edit-course" mat-stroked-button>ویرایش دوره</button>
    </div>
    }
}
